[project]
name = "ananke-hermes"
version = "0.1.1"
description = "Hermes SDK for Ananke"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Robert Goss" },
]
dependencies = [
    "confluent-kafka>=2.6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/robbitt07/ananke-hermes"
Repository = "https://github.com/robbitt07/ananke-hermes"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ananke_hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
